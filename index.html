<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2F6B3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Raíz Justa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- PANTALLA DE BIENVENIDA -->
  <section id="welcome-screen" class="screen">
    <div class="welcome-top">
      <!-- Logo SVG propio: hoja que nace de una raíz -->
      <div class="logo-wrap" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="84" height="84" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="56" fill="#FAF6EE"/>
          <!-- Raíces en tono tierra -->
          <path d="M60 66 C60 80, 48 88, 38 98" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M60 66 C60 82, 72 88, 82 98" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M60 70 C60 84, 58 94, 60 104" stroke="#8B5E3C" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <path d="M49 84 C43 85, 39 87, 34 86" stroke="#8B5E3C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M71 84 C77 85, 81 87, 86 86" stroke="#8B5E3C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <!-- Tallo -->
          <path d="M60 68 L60 44" stroke="#2F6B3A" stroke-width="5.5" stroke-linecap="round"/>
          <!-- Hoja principal -->
          <path d="M60 48 C60 24, 86 18, 92 22 C94 42, 78 56, 60 48 Z" fill="#2F6B3A"/>
          <!-- Hoja secundaria -->
          <path d="M60 54 C58 34, 34 28, 28 34 C28 50, 44 60, 60 54 Z" fill="#6FAE4F"/>
        </svg>
      </div>
      <h1 class="brand-title">Raíz Justa</h1>
      <p class="brand-slogan">Del surco a tu puerta, con precio justo.</p>
    </div>

    <div class="welcome-body">
      <p class="welcome-prompt">Elige cómo quieres entrar hoy:</p>

      <button class="role-card" onclick="entrarPerfil('familia')">
        <div class="role-emoji">🧺</div>
        <div class="role-text">
          <strong>Soy familia</strong>
          <span>Compra mercado fresco directo del campo</span>
        </div>
        <span class="role-chevron">›</span>
      </button>

      <button class="role-card role-campesino" onclick="entrarPerfil('campesino')">
        <div class="role-emoji">🌾</div>
        <div class="role-text">
          <strong>Soy campesino</strong>
          <span>Vende tu cosecha sin intermediarios</span>
        </div>
        <span class="role-chevron">›</span>
      </button>
    </div>
  </section>

  <!-- ESTRUCTURA PRINCIPAL DE LA APP -->
  <div id="app-shell" class="screen hidden">
    <header class="app-header">
      <div class="header-left">
        <div id="header-initials" class="initials-circle">FM</div>
        <div>
          <h2 id="header-title">Raíz Justa</h2>
          <p id="header-subtitle">Perfil Familia</p>
        </div>
      </div>
      <button class="btn-switch" onclick="volverBienvenida()">Cambiar perfil</button>
    </header>

    <main id="main-view" class="main-view">
      <!-- Contenido dinámico generado por app.js -->
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal">
      <!-- Botones generados según perfil -->
    </nav>
  </div>

  <!-- MODAL PARA PAGOS, FOTOS SIMULADAS, VIDEOS Y RETIROS -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="cerrarModalFondo(event)">
    <div class="modal-sheet">
      <div class="modal-bar"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- MENSAJE CORTO TIPO "¡LISTO!" -->
  <div id="toast" class="toast hidden">¡Listo!</div>

  <script src="app.js"></script>
  <script>
    // Registra el Service Worker para modo sin conexión
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
