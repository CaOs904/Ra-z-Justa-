<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2F6B3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Raíz Justa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ================= PANTALLA DE BIENVENIDA ================= -->
  <section id="welcome-screen" class="screen">
    <div class="welcome-hero">
      <!-- Paisaje campesino SVG a pantalla completa -->
      <svg class="hero-landscape" viewBox="0 0 480 340" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="cieloGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2F6B3A"/>
            <stop offset="65%" stop-color="#4A8948"/>
            <stop offset="100%" stop-color="#6FAE4F"/>
          </linearGradient>
          <radialGradient id="solGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF3C4"/>
            <stop offset="55%" stop-color="#F2B84B"/>
            <stop offset="100%" stop-color="#D9822B" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="480" height="340" fill="url(#cieloGrad)"/>
        <!-- Sol cálido -->
        <circle cx="385" cy="78" r="56" fill="url(#solGrad)"/>
        <circle cx="385" cy="78" r="26" fill="#FFE082"/>
        <!-- Montañas en capas -->
        <path d="M0 215 Q95 140 205 185 T480 165 L480 340 L0 340 Z" fill="#285C32" opacity="0.72"/>
        <path d="M0 245 Q130 175 265 225 T480 205 L480 340 L0 340 Z" fill="#3B7A41"/>
        <path d="M0 278 Q160 225 320 265 T480 250 L480 340 L0 340 Z" fill="#599646"/>
        <!-- Surcos de cultivo -->
        <path d="M20 310 Q140 272 280 295" stroke="#427A36" stroke-width="4" fill="none" opacity="0.6"/>
        <path d="M55 325 Q175 288 330 312" stroke="#427A36" stroke-width="4" fill="none" opacity="0.55"/>
        <path d="M120 335 Q250 302 420 322" stroke="#427A36" stroke-width="4" fill="none" opacity="0.5"/>
        <!-- Casa campesina pequeña -->
        <g transform="translate(335, 198)">
          <rect x="10" y="20" width="44" height="28" rx="2" fill="#FAF6EE"/>
          <polygon points="4,22 32,2 60,22" fill="#8B5E3C"/>
          <rect x="27" y="31" width="10" height="17" rx="1.5" fill="#8B5E3C"/>
          <rect x="15" y="27" width="8" height="8" rx="1" fill="#D9822B"/>
          <rect x="41" y="27" width="8" height="8" rx="1" fill="#D9822B"/>
        </g>
        <!-- Curva suave separadora -->
        <path d="M0 306 Q240 350 480 306 L480 340 L0 340 Z" fill="#FAF6EE"/>
      </svg>

      <!-- Logo, nombre y lema sobre el paisaje -->
      <div class="welcome-brand">
        <div class="logo-wrap" aria-hidden="true">
          <svg viewBox="0 0 120 120" width="76" height="76">
            <circle cx="60" cy="60" r="56" fill="#FAF6EE"/>
            <path d="M60 66 C60 80, 48 88, 38 98" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M60 66 C60 82, 72 88, 82 98" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M60 70 C60 84, 58 94, 60 104" stroke="#8B5E3C" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <path d="M60 68 L60 44" stroke="#2F6B3A" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M60 48 C60 24, 86 18, 92 22 C94 42, 78 56, 60 48 Z" fill="#2F6B3A"/>
            <path d="M60 54 C58 34, 34 28, 28 34 C28 50, 44 60, 60 54 Z" fill="#6FAE4F"/>
          </svg>
        </div>
        <h1 class="brand-title">Raíz Justa</h1>
        <p class="brand-slogan">Del surco a tu puerta, con precio justo.</p>
      </div>
    </div>

    <!-- Tarjetas de perfil montadas sobre la curva del paisaje -->
    <div class="welcome-cards">
      <button class="role-card role-familia" onclick="entrarPerfil('familia')">
        <div class="role-art">
          <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="#E8F4E5"/>
            <path d="M16 32 H48 L44 50 H20 Z" fill="#8B5E3C"/>
            <path d="M22 32 C22 20, 42 20, 42 32" stroke="#2F6B3A" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="27" cy="29" r="5" fill="#D9822B"/>
            <circle cx="37" cy="28" r="5" fill="#6FAE4F"/>
          </svg>
        </div>
        <div class="role-text">
          <strong>Soy familia</strong>
          <span>Mercado fresco directo de la finca</span>
        </div>
        <span class="role-arrow" aria-hidden="true">➜</span>
      </button>

      <button class="role-card role-campesino" onclick="entrarPerfil('campesino')">
        <div class="role-art">
          <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="#F5EBDC"/>
            <ellipse cx="32" cy="27" rx="20" ry="6" fill="#D9822B"/>
            <path d="M21 26 C22 15, 42 15, 43 26 Z" fill="#8B5E3C"/>
            <path d="M18 48 C18 37, 46 37, 46 48 Z" fill="#2F6B3A"/>
            <circle cx="32" cy="34" r="7" fill="#E8C29B"/>
          </svg>
        </div>
        <div class="role-text">
          <strong>Soy campesino</strong>
          <span>Vende tu cosecha sin intermediarios</span>
        </div>
        <span class="role-arrow" aria-hidden="true">➜</span>
      </button>
    </div>

    <!-- Franja de 3 mini beneficios -->
    <div class="benefits-strip">
      <div class="benefit-item">
        <span>🤝</span>
        <strong>Precio justo</strong>
      </div>
      <div class="benefit-item">
        <span>🌱</span>
        <strong>Fresco del campo</strong>
      </div>
      <div class="benefit-item">
        <span>⚡</span>
        <strong>Pago rápido</strong>
      </div>
    </div>
  </section>

  <!-- ================= ESTRUCTURA PRINCIPAL ================= -->
  <div id="app-shell" class="screen hidden">
    <header class="app-header">
      <div class="header-bg-landscape" aria-hidden="true">
        <svg viewBox="0 0 480 96" preserveAspectRatio="none">
          <path d="M0 55 Q120 20 260 48 T480 35 L480 96 L0 96 Z" fill="rgba(255,255,255,0.08)"/>
          <path d="M0 78 Q240 104 480 78 L480 96 L0 96 Z" fill="#FAF6EE"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-left">
          <div id="header-initials" class="initials-circle">FM</div>
          <div>
            <h2 id="header-title">Buenas, familia</h2>
            <p id="header-subtitle">Bogotá · Mercado directo</p>
          </div>
        </div>
        <button class="btn-switch" onclick="volverBienvenida()">Cambiar perfil</button>
      </div>
    </header>

    <main id="main-view" class="main-view">
      <!-- Renderizado dinámico por app.js -->
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal">
      <!-- Íconos SVG propios generados por app.js -->
    </nav>
  </div>

  <!-- MODAL INFERIOR -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="cerrarModalFondo(event)">
    <div class="modal-sheet">
      <div class="modal-bar"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden">¡Listo!</div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
