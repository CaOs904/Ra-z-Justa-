<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2F6B3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Raíz Justa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ================= PANTALLA DE BIENVENIDA: FINCA VIVA ================= -->
  <section id="welcome-screen" class="screen">
    <div class="welcome-hero">
      <!-- Ilustración SVG de finca viva (ocupa ~55% de la altura) -->
      <svg class="hero-landscape" viewBox="0 0 480 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="cieloAzul" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5BB5E8"/>
            <stop offset="68%" stop-color="#CDEBFA"/>
            <stop offset="100%" stop-color="#E5F6FD"/>
          </linearGradient>
          <radialGradient id="brilloSol" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF7CC" stop-opacity="0.95"/>
            <stop offset="55%" stop-color="#FFD54F" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Cielo azul -->
        <rect width="480" height="420" fill="url(#cieloAzul)"/>

        <!-- Sol con brillo pulsante y rayos que giran lento -->
        <g transform="translate(405, 68)">
          <circle class="sun-glow" cx="0" cy="0" r="56" fill="url(#brilloSol)"/>
          <g class="sun-rays" stroke="#FFE082" stroke-width="3.5" stroke-linecap="round">
            <line x1="0" y1="-34" x2="0" y2="-44"/>
            <line x1="0" y1="34" x2="0" y2="44"/>
            <line x1="-34" y1="0" x2="-44" y2="0"/>
            <line x1="34" y1="0" x2="44" y2="0"/>
            <line x1="-24" y1="-24" x2="-31" y2="-31"/>
            <line x1="24" y1="-24" x2="31" y2="-31"/>
            <line x1="-24" y1="24" x2="-31" y2="31"/>
            <line x1="24" y1="24" x2="31" y2="31"/>
          </g>
          <circle cx="0" cy="0" r="24" fill="#FFD54F"/>
          <circle cx="0" cy="0" r="19" fill="#FFF3B0"/>
        </g>

        <!-- Nubes que se desplazan despacio -->
        <g class="cloud cloud-1" fill="#FFFFFF" opacity="0.88">
          <ellipse cx="90" cy="64" rx="34" ry="14"/>
          <ellipse cx="114" cy="58" rx="26" ry="15"/>
          <ellipse cx="70" cy="68" rx="22" ry="11"/>
        </g>
        <g class="cloud cloud-2" fill="#FFFFFF" opacity="0.78">
          <ellipse cx="290" cy="110" rx="28" ry="11"/>
          <ellipse cx="310" cy="105" rx="22" ry="12"/>
        </g>

        <!-- Pájaros cruzando el cielo -->
        <g class="birds" fill="none" stroke="#1E4D2B" stroke-width="2.2" stroke-linecap="round">
          <path d="M120 120 Q126 114 132 120 Q138 114 144 120"/>
          <path d="M150 134 Q155 129 160 134 Q165 129 170 134"/>
        </g>

        <!-- Montañas verdes en capas -->
        <path d="M0 245 Q95 165 215 215 T480 190 L480 420 L0 420 Z" fill="#6FAE4F" opacity="0.72"/>
        <path d="M0 278 Q135 205 275 258 T480 232 L480 420 L0 420 Z" fill="#468945"/>
        <path d="M0 308 Q160 264 315 298 T480 278 L480 420 L0 420 Z" fill="#2F6B3A"/>

        <!-- Establo pequeño (izquierda) -->
        <g transform="translate(36, 232)">
          <rect x="6" y="20" width="44" height="30" rx="2" fill="#A65E3E"/>
          <polygon points="0,22 28,2 56,22" fill="#6E4427"/>
          <rect x="19" y="30" width="18" height="20" fill="#5A371F"/>
          <path d="M19 30 L37 50 M37 30 L19 50" stroke="#FAF6EE" stroke-width="1.6"/>
        </g>

        <!-- Casa de campo con chimenea y humo suave (derecha, debajo de la píldora) -->
        <g transform="translate(330, 224)">
          <!-- Chimenea y humo -->
          <rect x="46" y="4" width="9" height="18" fill="#8B5E3C"/>
          <circle class="smoke smoke-1" cx="50" cy="-2" r="5" fill="#FFFFFF" opacity="0.75"/>
          <circle class="smoke smoke-2" cx="55" cy="-12" r="7" fill="#FFFFFF" opacity="0.6"/>
          <circle class="smoke smoke-3" cx="62" cy="-24" r="8" fill="#FFFFFF" opacity="0.45"/>
          <!-- Estructura casa -->
          <rect x="10" y="24" width="52" height="34" rx="2" fill="#FAF6EE"/>
          <polygon points="3,26 36,4 69,26" fill="#8B5E3C"/>
          <rect x="30" y="37" width="12" height="21" rx="1.5" fill="#8B5E3C"/>
          <rect x="16" y="33" width="10" height="10" rx="1.5" fill="#D9822B"/>
          <rect x="46" y="33" width="10" height="10" rx="1.5" fill="#D9822B"/>
        </g>

        <!-- Surcos de cultivo en perspectiva -->
        <path d="M0 326 Q240 296 480 326 L480 420 L0 420 Z" fill="#5B9444"/>
        <path d="M-10 398 L165 316" stroke="#3F7332" stroke-width="4" opacity="0.65"/>
        <path d="M60 408 L205 316" stroke="#3F7332" stroke-width="4" opacity="0.65"/>
        <path d="M145 412 L245 316" stroke="#3F7332" stroke-width="4" opacity="0.65"/>
        <path d="M240 412 L285 316" stroke="#3F7332" stroke-width="4" opacity="0.65"/>
        <path d="M335 408 L325 316" stroke="#3F7332" stroke-width="4" opacity="0.65"/>
        <path d="M430 402 L365 316" stroke="#3F7332" stroke-width="4" opacity="0.65"/>

        <!-- Plantas que se mecen suavemente -->
        <g class="plant-sway" transform="translate(115, 344)">
          <path d="M0 0 Q-8 -12 -14 -8 Q-6 -2 0 0 Z" fill="#2F6B3A"/>
          <path d="M0 0 Q8 -14 14 -9 Q6 -2 0 0 Z" fill="#88C45E"/>
        </g>
        <g class="plant-sway plant-delay" transform="translate(212, 348)">
          <path d="M0 0 Q-9 -13 -15 -8 Q-6 -2 0 0 Z" fill="#2F6B3A"/>
          <path d="M0 0 Q9 -15 15 -9 Q6 -2 0 0 Z" fill="#88C45E"/>
        </g>
        <g class="plant-sway" transform="translate(362, 342)">
          <path d="M0 0 Q-8 -12 -14 -8 Q-6 -2 0 0 Z" fill="#2F6B3A"/>
          <path d="M0 0 Q8 -14 14 -9 Q6 -2 0 0 Z" fill="#88C45E"/>
        </g>

        <!-- Campesino con sombrero en el cultivo -->
        <g transform="translate(262, 286)">
          <ellipse cx="14" cy="11" rx="14" ry="4" fill="#D9822B"/>
          <path d="M6 10 C7 3, 21 3, 22 10 Z" fill="#8B5E3C"/>
          <circle cx="14" cy="16" r="5" fill="#E8C29B"/>
          <path d="M5 36 C5 23, 23 23, 23 36 Z" fill="#FAF6EE"/>
          <rect x="8" y="35" width="12" height="12" rx="2" fill="#2F6B3A"/>
        </g>

        <!-- Curva suave separadora hacia el fondo crema -->
        <path d="M0 374 Q240 420 480 374 L480 420 L0 420 Z" fill="#FAF6EE"/>
      </svg>

      <!-- Píldora blanca translúcida con logo, nombre y lema (alto contraste #1E4D2B) -->
      <div class="welcome-brand">
        <div class="brand-pill">
          <div class="logo-wrap" aria-hidden="true">
            <svg viewBox="0 0 120 120" width="60" height="60">
              <circle cx="60" cy="60" r="56" fill="#FAF6EE"/>
              <path d="M60 66 C60 80, 48 88, 38 98" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round" fill="none"/>
              <path d="M60 66 C60 82, 72 88, 82 98" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round" fill="none"/>
              <path d="M60 70 C60 84, 58 94, 60 104" stroke="#8B5E3C" stroke-width="4.5" stroke-linecap="round" fill="none"/>
              <path d="M60 68 L60 44" stroke="#2F6B3A" stroke-width="5.5" stroke-linecap="round"/>
              <path d="M60 48 C60 24, 86 18, 92 22 C94 42, 78 56, 60 48 Z" fill="#2F6B3A"/>
              <path d="M60 54 C58 34, 34 28, 28 34 C28 50, 44 60, 60 54 Z" fill="#6FAE4F"/>
            </svg>
          </div>
          <h1 class="brand-title">Raíz Justa</h1>
          <p class="brand-slogan">Del surco a tu puerta, con precio justo.</p>
        </div>
      </div>
    </div>

    <!-- Tarjetas de perfil más grandes y elevadas -->
    <div class="welcome-cards">
      <button class="role-card role-familia" onclick="entrarPerfil('familia')">
        <div class="role-art">
          <svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="#E8F4E5"/>
            <path d="M16 32 H48 L44 50 H20 Z" fill="#8B5E3C"/>
            <path d="M22 32 C22 20, 42 20, 42 32" stroke="#2F6B3A" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="27" cy="29" r="5" fill="#D9822B"/>
            <circle cx="37" cy="28" r="5" fill="#6FAE4F"/>
          </svg>
        </div>
        <div class="role-text">
          <strong>Soy familia</strong>
          <span>Mercado fresco directo de la finca</span>
        </div>
        <span class="role-arrow" aria-hidden="true">➜</span>
      </button>

      <button class="role-card role-campesino" onclick="entrarPerfil('campesino')">
        <div class="role-art">
          <svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="#F5EBDC"/>
            <ellipse cx="32" cy="27" rx="20" ry="6" fill="#D9822B"/>
            <path d="M21 26 C22 15, 42 15, 43 26 Z" fill="#8B5E3C"/>
            <path d="M18 48 C18 37, 46 37, 46 48 Z" fill="#2F6B3A"/>
            <circle cx="32" cy="34" r="7" fill="#E8C29B"/>
          </svg>
        </div>
        <div class="role-text">
          <strong>Soy campesino</strong>
          <span>Vende tu cosecha sin intermediarios</span>
        </div>
        <span class="role-arrow" aria-hidden="true">➜</span>
      </button>
    </div>

    <!-- Franja de 3 mini beneficios -->
    <div class="benefits-strip">
      <div class="benefit-item">
        <span>🤝</span>
        <strong>Precio justo</strong>
      </div>
      <div class="benefit-item">
        <span>🌱</span>
        <strong>Fresco del campo</strong>
      </div>
      <div class="benefit-item">
        <span>⚡</span>
        <strong>Pago rápido</strong>
      </div>
    </div>
  </section>

  <!-- ================= ESTRUCTURA PRINCIPAL ================= -->
  <div id="app-shell" class="screen hidden">
    <header class="app-header">
      <div class="header-bg-landscape" aria-hidden="true">
        <svg viewBox="0 0 480 96" preserveAspectRatio="none">
          <path d="M0 55 Q120 20 260 48 T480 35 L480 96 L0 96 Z" fill="rgba(255,255,255,0.08)"/>
          <path d="M0 78 Q240 104 480 78 L480 96 L0 96 Z" fill="#FAF6EE"/>
        </svg>
      </div>
      <div class="header-content">
        <div class="header-left">
          <div id="header-initials" class="initials-circle">FM</div>
          <div>
            <h2 id="header-title">Buenas, familia</h2>
            <p id="header-subtitle">Bogotá · Mercado directo</p>
          </div>
        </div>
        <button class="btn-switch" onclick="abrirMenuPerfil()">Cambiar perfil</button>
      </div>
    </header>

    <main id="main-view" class="main-view">
      <!-- Renderizado dinámico por app.js -->
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal">
      <!-- Íconos SVG propios generados por app.js -->
    </nav>
  </div>

  <!-- MODAL INFERIOR -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="cerrarModalFondo(event)">
    <div class="modal-sheet">
      <div class="modal-bar"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden">¡Listo!</div>

  <script src="productos.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
